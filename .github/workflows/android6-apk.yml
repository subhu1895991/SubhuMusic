name: Build SUMITX Android 6+ APK (manual debug build)

on:
  # This workflow is manual-only. The automatic APK build is handled by
  # subhumusic-apk.yml, which also uses the optimized debug-signed variant.
  workflow_dispatch:
    inputs:
      source_ref:
        description: SUMITX branch, tag, or commit to build
        required: false
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: sumitx-android6-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android 6+ debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SUMITX
        uses: actions/checkout@v4
        with:
          repository: subhu1895991/SubHuMusic
          ref: ${{ inputs.source_ref || 'master' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37 and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      # The normal debug build supports minSdk 23 (Android 6+) and is signed
      # using Android's automatic debug key; no secrets are required.
      - name: Build standard Android 6+ debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/SUMITX-Android-6plus.apk
          ls -lh dist/SUMITX-Android-6plus.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SUMITX-Android-6plus-APK
          path: dist/SUMITX-Android-6plus.apk
          if-no-files-found: error
          retention-days: 14

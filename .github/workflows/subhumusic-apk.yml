name: Build SUMITX APK (direct install, no publishing)

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'app/proguard-rules.pro'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/subhumusic-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SUMITX
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37 and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      # Standard debug variant: no R8/resource shrinking and automatic debug signing.
      # No keystore secrets, release signing, or publishing.
      - name: Build installable ARM64 debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare SUMITX APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" dist/SUMITX.apk
          ls -lh dist/SUMITX.apk

      - name: Upload SUMITX APK
        uses: actions/upload-artifact@v4
        with:
          name: SUMITX-APK
          path: dist/SUMITX.apk
          if-no-files-found: error
          retention-days: 14

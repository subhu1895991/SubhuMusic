name: Publish SUMITX Android Release

run-name: Publish SUMITX ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New Android release version (for example: v1.8.19)"
        required: true
        default: v1.8.19
        type: string
      source_ref:
        description: "Android source branch, tag, or commit to build"
        required: true
        default: master
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: subhumusic-android-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, sign, and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout SUMITX
        uses: actions/checkout@v4
        with:
          repository: subhu1895991/SubHuMusic
          ref: ${{ inputs.source_ref }}

      - name: Resolve Android version and version code
        id: release-version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Use a release tag like v1.8.19 (major.minor.patch)." >&2
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          if (( MINOR > 999 || PATCH > 999 )); then
            echo "Minor and patch numbers must be 999 or lower." >&2
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 27 || VERSION_CODE > 2100000000 )); then
            echo "The calculated Android versionCode is outside the supported range." >&2
            exit 1
          fi

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building SUMITX $VERSION (versionCode $VERSION_CODE)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build optimized ARM64-v8a release APK
        env:
          APP_VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.release-version.outputs.version_code }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
            -PAPP_VERSION_CODE="$APP_VERSION_CODE" \
            assembleRelease

      - name: Sign APK with the SUMITX release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
          SIGNING_KEYSTORE_TYPE: PKCS12
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing BATTERYPULSE_KEYSTORE_BASE64}"
          : "${SIGNING_KEYSTORE_PASSWORD:?Missing BATTERYPULSE_STORE_PASSWORD}"
          : "${SIGNING_KEY_ALIAS:?Missing BATTERYPULSE_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing BATTERYPULSE_KEY_PASSWORD}"

          BUILD_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$BUILD_DIR/app-arm64-v8a-release-unsigned.apk"
          OUTPUT_APK="release-assets/SUMITX-Android.apk"
          KEYSTORE="$RUNNER_TEMP/subhumusic-release-keystore.p12"
          ALIGNED_APK="$RUNNER_TEMP/SUMITX-arm64-v8a-aligned.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/37.0.0/zipalign"
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"

          test -s "$SOURCE_APK"
          mkdir -p release-assets
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype "$SIGNING_KEYSTORE_TYPE" -keystore "$KEYSTORE" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

          "$ZIPALIGN" -f -p 4 "$SOURCE_APK" "$ALIGNED_APK"
          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type "$SIGNING_KEYSTORE_TYPE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$OUTPUT_APK" "$ALIGNED_APK"

          "$APK_SIGNER" verify --verbose --print-certs "$OUTPUT_APK"
          sha256sum "$OUTPUT_APK" > "$OUTPUT_APK.sha256"
          ls -lh release-assets

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.source_ref }}
          name: SUMITX ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/SUMITX-Android.apk
            release-assets/SUMITX-Android.apk.sha256
